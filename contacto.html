<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sitio de Emergencia - Contacto</title>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Sitio de Emergencia</h1>
    </header>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="tipos.html">Tipos de Emergencia</a>
        <a href="quehacer.html">¿Qué hacer en caso de emergencia?</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section>

            <form action="#" method="post">
                <p>
                    <label for="nombre">Ingresa tu nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </p>

                <p>
                    <label for="tipo">Tipo de emergencia:</label>
                    <select id="tipo" name="tipo">
                        <option value="medica">Médica / Ambulancia</option>
                        <option value="bomberos">Incendio / Bomberos</option>
                        <option value="policia">Seguridad / Policía</option>
                        <option value="proteccion">Protección Civil</option>
                    </select>
                </p>

                <p>
                    <label for="ubicacion">Ubicación:</label>
                    <input type="text" id="ubicacion" name="ubicacion">
                </p>

                <p>
                    <label for="telefono">Número de teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>

                <p>
                    <input type="submit" value="enviar">
                </p>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Hernandez Cuellar Emiliano 5-J 0850</p>
    </footer>


</body>
</html>
